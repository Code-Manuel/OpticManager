<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpticManager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
    </svg>
    <span>OpticManager</span>
  </div>

  <div class="sidebar-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search-input" type="text" placeholder="Cerca paziente…" />
  </div>

  <div class="sidebar-actions">
    <button class="btn-primary btn-full" id="btn-new-patient">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nuovo paziente
    </button>
  </div>

  <nav class="patient-list" id="patient-list">
    <div class="empty-list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <p>Nessun paziente</p>
    </div>
  </nav>

  <div class="sidebar-footer">
    <span id="patient-count">0 pazienti</span>
  </div>
</aside>

<!-- ── MAIN ── -->
<main class="main">

  <!-- Welcome / Empty state -->
  <div class="welcome-state" id="welcome-state">
    <div class="welcome-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="4"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
      </svg>
      <h2>Benvenuto in OpticManager</h2>
      <p>Seleziona un paziente dalla lista o aggiungine uno nuovo per iniziare.</p>
      <button class="btn-primary" id="btn-new-patient-welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Aggiungi il primo paziente
      </button>
    </div>
  </div>

  <!-- Patient detail -->
  <div class="detail-panel" id="detail-panel" style="display:none">

    <div class="detail-header">
      <div class="detail-avatar" id="detail-avatar">--</div>
      <div class="detail-info">
        <h1 id="detail-name">-</h1>
        <div class="detail-meta">
          <span id="detail-cf"></span>
          <span id="detail-birth"></span>
          <span id="detail-phone"></span>
          <span id="detail-email"></span>
        </div>
      </div>
      <div class="detail-header-actions">
        <button class="btn-secondary" id="btn-edit-patient">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Modifica
        </button>
        <button class="btn-danger" id="btn-delete-patient">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          Elimina
        </button>
      </div>
    </div>

    <!-- Prescriptions section -->
    <div class="prescriptions-section">
      <div class="section-header">
        <h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
          </svg>
          Prescrizioni ottiche
        </h2>
        <button class="btn-primary btn-sm" id="btn-new-rx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nuova prescrizione
        </button>
      </div>
      <div id="prescriptions-list" class="rx-grid">
        <div class="empty-rx">
          <p>Nessuna prescrizione registrata</p>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ── MODAL PAZIENTE ── -->
<div class="modal-overlay" id="patient-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="patient-modal-title">Nuovo paziente</h3>
      <button class="modal-close" data-close="patient-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <form id="patient-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label>Nome *</label>
          <input type="text" name="firstName" required maxlength="100" />
          <span class="field-error"></span>
        </div>
        <div class="form-group">
          <label>Cognome *</label>
          <input type="text" name="lastName" required maxlength="100" />
          <span class="field-error"></span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Codice Fiscale *</label>
          <input type="text" name="fiscalCode" required maxlength="16"
                 pattern="^[A-Z]{6}[0-9]{2}[A-EHLMPRST][0-9]{2}[A-Z][0-9]{3}[A-Z]$"
                 placeholder="RSSMRC80A01H501Z"
                 style="text-transform:uppercase"/>
          <span class="field-error"></span>
        </div>
        <div class="form-group">
          <label>Data di nascita *</label>
          <input type="date" name="birthDate" required />
          <span class="field-error"></span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Telefono</label>
          <input type="tel" name="phone" placeholder="+39 333 1234567" />
          <span class="field-error"></span>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" />
          <span class="field-error"></span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-close="patient-modal">Annulla</button>
        <button type="submit" class="btn-primary" id="patient-submit-btn">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- ── MODAL PRESCRIZIONE ── -->
<div class="modal-overlay" id="rx-modal">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="rx-modal-title">Nuova prescrizione</h3>
      <button class="modal-close" data-close="rx-modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <form id="rx-form" novalidate>
      <div class="form-group">
        <label>Data visita *</label>
        <input type="date" name="visitDate" required />
        <span class="field-error"></span>
      </div>

      <div class="rx-eyes-grid">
        <!-- OD -->
        <div class="eye-card">
          <div class="eye-card-header od">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
            </svg>
            Occhio destro (OD)
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Sfera</label>
              <input type="number" name="sphereOD" step="0.25" min="-20" max="20" placeholder="es. -2.50"/>
            </div>
            <div class="form-group">
              <label>Cilindro</label>
              <input type="number" name="cylinderOD" step="0.25" min="-10" max="10" placeholder="es. -0.75"/>
            </div>
            <div class="form-group">
              <label>Asse °</label>
              <input type="number" name="axisOD" step="1" min="0" max="180" placeholder="0-180"/>
            </div>
          </div>
        </div>

        <!-- OS -->
        <div class="eye-card">
          <div class="eye-card-header os">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
            </svg>
            Occhio sinistro (OS)
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Sfera</label>
              <input type="number" name="sphereOS" step="0.25" min="-20" max="20" placeholder="es. -1.75"/>
            </div>
            <div class="form-group">
              <label>Cilindro</label>
              <input type="number" name="cylinderOS" step="0.25" min="-10" max="10" placeholder="es. -0.50"/>
            </div>
            <div class="form-group">
              <label>Asse °</label>
              <input type="number" name="axisOS" step="1" min="0" max="180" placeholder="0-180"/>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Distanza interpupillare (mm)</label>
          <input type="number" name="pupillaryDistance" step="0.5" min="50" max="80" placeholder="es. 64.0"/>
        </div>
        <div class="form-group form-group-notes">
          <label>Note</label>
          <textarea name="notes" maxlength="500" rows="2" placeholder="Note aggiuntive…"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-close="rx-modal">Annulla</button>
        <button type="submit" class="btn-primary" id="rx-submit-btn">Salva</button>
      </div>
    </form>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast-container"></div>

<script src="js/app.js"></script>
</body>
</html>
