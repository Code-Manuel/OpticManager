version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opticmanager-db
    environment:
      POSTGRES_DB: opticmanager
      POSTGRES_USER: opticmanager
      POSTGRES_PASSWORD: opticmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
